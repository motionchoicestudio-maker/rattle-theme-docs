<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rattle theme support</title>
<style>
  :root { --ink: #0e0e0e; --mute: #5f5f5f; --line: #e6e6e6; --tile: #f3f3f3; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 Inter, -apple-system, system-ui, sans-serif; color: var(--ink); background: #fff; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 72px 24px 120px; }
  h1 { font-size: 48px; line-height: 1; letter-spacing: -0.04em; margin: 0 0 16px; font-weight: 600; }
  .lead { font-size: 18px; color: var(--mute); margin: 0 0 40px; }
  a { color: var(--ink); }
  form { display: grid; gap: 20px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--mute); }
  input, textarea { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid #cfcfcf; border-radius: 12px; background: #fff; color: var(--ink); }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  textarea { min-height: 160px; resize: vertical; }
  input[type="file"] { padding: 10px; background: var(--tile); border-style: dashed; }
  button { justify-self: start; font: inherit; font-weight: 500; padding: 14px 26px; border: 0; border-radius: 100px; background: var(--ink); color: #fff; cursor: pointer; }
  .sent { display: none; padding: 16px 18px; border-radius: 12px; background: var(--tile); margin-bottom: 32px; }
  .sent:target, .is-sent .sent { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <p><a href="./">← Rattle documentation</a></p>
  <h1>Theme support</h1>
  <p class="lead">Questions about Rattle, a bug or a feature request. A person reads every message and replies within two business days.</p>
  <p class="sent" id="sent" role="status">Thanks, your request is in. We have sent a copy to your email and will reply within two business days.</p>

  <form action="https://formsubmit.co/promakdesign@gmail.com" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="_subject" value="Rattle theme support request">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://motionchoicestudio-maker.github.io/rattle-theme-docs/support.html?sent=1#sent">
    <input type="hidden" name="_autoresponse" value="Thanks for contacting Rattle theme support. We have your request and will reply within two business days. If you have more details or screenshots, reply to this email.">

    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div>
      <label for="store">Store URL <span class="hint">for example www.storename.myshopify.com</span></label>
      <input id="store" name="store_url" type="text" placeholder="www.storename.myshopify.com" required>
    </div>
    <div>
      <label for="message">Describe the problem</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <div>
      <label for="attachment">Screenshot <span class="hint">optional, image up to 5 MB</span></label>
      <input id="attachment" name="attachment" type="file" accept="image/*">
    </div>
    <button type="submit">Send request</button>
  </form>
</div>
<script>
  if (new URLSearchParams(location.search).has('sent')) document.body.classList.add('is-sent');
</script>
</body>
</html>
